---
- block:
  - name: install desktop tools
    community.general.flatpak:
      name: "{{item}}"
      state: present
    with_items:
      - com.discordapp.Discord
      - com.jgraph.drawio.desktop
      - com.slack.Slack
      - org.zotero.Zotero
      - org.kde.kdenlive
      - org.gnome.meld
      - com.makemkv.MakeMKV
    become: yes
    tags:
      - desktop
      - desktop_apps
  - name: install desktop tools
    ansible.builtin.package:
      name: "{{item}}"
      state: present
    with_items:
      - ardour # what is the alternative?
      - carla  # what is the alternative?
      - lsp-plugins-vst  # what is the alternative?
      - lsp-plugins # what is the alternative?
      - gimp
      - inkscape
      - scribus
      - vlc
    become: yes
    tags:
      - desktop
      - desktop_apps
  when: ansible_facts['os_family'] == 'RedHat'
- block:
  - name: install developer tools
    ansible.builtin.package:
      name: "{{item}}"
      state: present
    with_items:
      # slack is managed by ANL
      # iMovie/FinalCut instead of KDENLIVE
      # ProTools instead of Ardour+
      # com.makemkv.MakeMKV not needed on a work machine
      - discord
      - drawio
      - zotero
      - meld
      - bitwarden
      - caffeine
      - activitywatch #TODO need to configure
      - mas # needed to install MacOS Apps from the AppStore with Ansible
    tags:
      - desktop
      - desktop_apps
  - name: install developer tools
    community.general.mas:
      id: "{{item}}"
      state: present
    environment:
      PATH: /opt/homebrew/bin:{{ ansible_facts['env'].PATH }}
    with_items:
      - 1435957248 # Drafts
      - 6745342698 # UBlockOrigin
      - 1462114288 # Grammarly
    tags:
      - desktop
      - desktop_apps
  when: ansible_facts['os_family'] == 'Darwin'
