---
- name: install desktop tools
  community.general.flatpak:
    name: "{{item}}"
    state: present
  with_items:
    - com.discordapp.Discord
    - com.jgraph.drawio.desktop
    - com.slack.Slack
    - org.zotero.Zotero
    - org.kde.kdenlive
    - org.gnome.meld
    - com.makemkv.MakeMKV # does not pass gatekeeper, not needed on work machine
    # add Drafts, Caffine, Grammarly, uBlockOrigin for Macos
  become: yes
  tags:
    - desktop
    - desktop_apps
  when: ansible_facts['os_family'] == 'RedHat'
- name: install desktop tools
  ansible.builtin.package:
    name: "{{item}}"
    state: present
  with_items:
    - ardour9 # what is the alternative?
    - Carla  # what is the alternative?
    - lsp-plugins-vst  # what is the alternative?
    - lsp-plugins # what is the alternative?
    - gimp
    - inkscape
    - scribus
    - vlc
  become: yes
  tags:
    - desktop
    - desktop_apps
# TODO add activitywatch.  Need to find a way to share configuration file
